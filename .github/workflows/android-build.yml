name: 'Build Android App'

# Builds the SiteWise Android app (APK + AAB) with Tauri v2 mobile.
#
# Triggers:
#   - Git tags `v*`  -> attaches signed artifacts to the GitHub Release.
#   - Manual dispatch -> builds and uploads artifacts for testing.
#
# Release signing is OPTIONAL: if the ANDROID_KEYSTORE_BASE64 secret is present
# the release artifacts are signed with the upload keystore (suitable for Play
# Store upload); otherwise the release build is signed with the Android debug key
# so the produced APK is still INSTALLABLE for sideloading/testing. A release APK
# left fully unsigned cannot be installed at all ("package appears to be invalid").

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Artifact to build'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both

env:
  # Rust targets for Android ABIs. armv7/x86 are included for broad device and
  # emulator coverage; trim this list to speed up builds if needed.
  ANDROID_TARGETS: 'aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -eux
          sdkmanager "ndk;26.1.10909125" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: rustup target add $ANDROID_TARGETS

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        # Generates src-tauri/gen/android (git-ignored) from tauri.conf.json.
        run: npm run android:init

      - name: Generate app icons for the Android project
        # Populates the freshly generated project's launcher icons from the
        # branded source icon.
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Apply safe-zone adaptive launcher foregrounds
        # `tauri icon` regenerates the adaptive-icon foreground edge-to-edge, so
        # Android's launcher mask crops the SiteWise mark. Restore our committed
        # pre-padded foregrounds (logo within the adaptive-icon safe zone) and
        # copy them into the generated Android project.
        run: |
          set -eux
          git checkout -- src-tauri/icons/android
          node scripts/fix-android-adaptive-icons.mjs

      - name: Configure Android signing
        # Always runs: with a keystore secret it configures release signing,
        # otherwise it falls back to debug-signing the release build so the APK
        # is installable. Skipping this step entirely would leave the release
        # APK unsigned and uninstallable.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/setup-android-signing.mjs

      - name: Build Android APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: npm run build:android:apk

      - name: Build Android AAB
        if: ${{ github.event_name == 'push' || inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: npm run build:android:aab

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p artifacts
          find src-tauri/gen/android -type f \( -name '*.apk' -o -name '*.aab' \) \
            -exec cp {} artifacts/ \; || true
          ls -la artifacts || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitewise-android
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
